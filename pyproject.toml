[build-system]
requires = [
    "hatchling>=1.3.1",
    "hatch-vcs",
]
build-backend = "hatchling.build"

[project]
name = "bmst"
description = "simple backup store"
readme = "README.rst"
license = "agpl-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "click",
    "click_log",
    "httpx",
    "orjson",
    "werkzeug",
]
dynamic = [
    "version",
]
[dependency-groups]
test = [
    "pytest",
    "mypy",
    "ruff",
    "types-waitress",
]

[project.scripts]
bmst = "bmst.main:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "bmst/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [
    ".github",
]
[tool.hatch.build.targets.wheel]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
extend-select = [
    "I",    # isort
    "UP",   # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["bmst"]

[tool.uv]
default-groups = ["test"]
